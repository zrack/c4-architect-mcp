<svg xmlns="http://www.w3.org/2000/svg" width="1364" height="737" viewBox="0 0 1364 737" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
<title id="title">Bridge after Kafka — delivery and replay</title>
<desc id="description">The bridge consumes from Kafka. The application writes the delivered event to Oracle RAC. Kafka checkpoint owner: Integration bridge. Numbered interactions read from top to bottom in each panel. Each arrow starts at the sending actor's dot and ends at its recipient.</desc>

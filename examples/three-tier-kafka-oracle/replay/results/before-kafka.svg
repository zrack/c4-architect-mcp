<svg xmlns="http://www.w3.org/2000/svg" width="1364" height="661" viewBox="0 0 1364 661" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
<title id="title">Bridge before Kafka — delivery and replay</title>
<desc id="description">The bridge publishes. The application consumes from Kafka and writes to Oracle RAC. Kafka checkpoint owner: Application server. Numbered interactions read from top to bottom in each panel. Each arrow starts at the sending actor's dot and ends at its recipient.</desc>
<rect width="1364" height="661" fill="#f6f9fa"/>
<text x="24" y="43" font-size="33" font-weight="700" text-anchor="start" fill="#172b43">Bridge before Kafka</text>
<text x="24" y="74" font-size="19" font-weight="400" text-anchor="start" fill="#425970">The bridge publishes. The application consumes from Kafka and writes to Oracle RAC.</text>
<text x="1340" y="36" font-size="16" font-weight="400" text-anchor="end" fill="#425970">Kafka checkpoint owner</text>
<text x="1340" y="64" font-size="23" font-weight="700" text-anchor="end" fill="#086454">Application server</text>
<g transform="translate(24 104)" role="group" aria-label="Successful delivery"><rect width="648" height="343" rx="10" fill="white" stroke="#c1cfd8"/><text x="18" y="32" font-size="24" font-weight="700" text-anchor="start" fill="#172b43">Successful delivery</text>
<text x="18" y="65" font-size="14" font-weight="700" text-anchor="start" fill="#425970">Step</text>

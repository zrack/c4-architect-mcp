<line x1="440" x2="440" y1="76" y2="288" stroke="#b7c7d2" stroke-dasharray="3 4"/>
<line x1="516" x2="516" y1="76" y2="288" stroke="#b7c7d2" stroke-dasharray="3 4"/>
<line x1="592" x2="592" y1="76" y2="288" stroke="#b7c7d2" stroke-dasharray="3 4"/>

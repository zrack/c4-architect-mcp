<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc"><title id="title">From local source to a reviewable architecture</title><desc id="desc">Five steps: parse source, resolve imports, review boundaries, inspect the graph, render and share</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#328f9e" stroke-width="1.5"/></marker></defs><rect width="1600" height="450" rx="20" fill="#f0f6fa"/><g font-family="Arial, sans-serif"><text x="55" y="65" fill="#0e2d46" font-size="32" font-weight="700">From source files to a reviewable architecture</text><text x="55" y="105" fill="#48657a" font-size="21">One versioned graph. Preserve the evidence. Make the assumptions visible.</text><path d="M333 253h22" fill="none" stroke="#328f9e" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="151" width="270" height="210" rx="16" fill="white" stroke="#cbdde7"/><circle cx="95" cy="193" r="22" fill="#174b6b"/><text x="95" y="200" text-anchor="middle" fill="white" font-size="17" font-weight="700">01</text><text x="79" y="253" fill="#102f47" font-size="24" font-weight="700">Parse source</text><text x="79" y="293" fill="#48657a" font-size="20">Local Tree-sitter</text><text x="79" y="323" fill="#48657a" font-size="20">TypeScript + TSX</text><path d="M638 253h22" fill="none" stroke="#328f9e" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="151" width="270" height="210" rx="16" fill="white" stroke="#cbdde7"/><circle cx="400" cy="193" r="22" fill="#174b6b"/><text x="400" y="200" text-anchor="middle" fill="white" font-size="17" font-weight="700">02</text><text x="384" y="253" fill="#102f47" font-size="24" font-weight="700">Resolve imports</text><text x="384" y="293" fill="#48657a" font-size="20">Aliases + modules</text><text x="384" y="323" fill="#48657a" font-size="20">Source positions</text><path d="M943 253h22" fill="none" stroke="#328f9e" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="151" width="270" height="210" rx="16" fill="white" stroke="#cbdde7"/><circle cx="705" cy="193" r="22" fill="#116e67"/><text x="705" y="200" text-anchor="middle" fill="white" font-size="17" font-weight="700">03</text><text x="689" y="253" fill="#102f47" font-size="24" font-weight="700">Review boundaries</text><text x="689" y="293" fill="#48657a" font-size="20">Observed · inferred</text><text x="689" y="323" fill="#48657a" font-size="20">Declared mappings</text><path d="M1248 253h22" fill="none" stroke="#328f9e" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="151" width="270" height="210" rx="16" fill="white" stroke="#cbdde7"/><circle cx="1010" cy="193" r="22" fill="#174b6b"/><text x="1010" y="200" text-anchor="middle" fill="white" font-size="17" font-weight="700">04</text><text x="994" y="253" fill="#102f47" font-size="24" font-weight="700">Inspect the graph</text><text x="994" y="293" fill="#48657a" font-size="20">Bounded queries</text><text x="994" y="323" fill="#48657a" font-size="20">Snapshot comparison</text><rect x="1275" y="151" width="270" height="210" rx="16" fill="white" stroke="#cbdde7"/><circle cx="1315" cy="193" r="22" fill="#174b6b"/><text x="1315" y="200" text-anchor="middle" fill="white" font-size="17" font-weight="700">05</text><text x="1299" y="253" fill="#102f47" font-size="24" font-weight="700">Render + share</text><text x="1299" y="293" fill="#48657a" font-size="20">Interactive highlights</text><text x="1299" y="323" fill="#48657a" font-size="20">PNG · SVG · HTML</text><text x="55" y="410" fill="#496879" font-size="18">Stable identities · Content hashes · File / line evidence · Resolution diagnostics · Explicit limits</text></g></svg>

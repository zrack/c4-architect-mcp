</style></head><body><header><h1>From Kafka order to billing record</h1><span>Select a node or arrow to trace its connections.</span><button id="reset-view">Show all</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="export-png" title="Save the full diagram at 2× resolution with current highlighting">Export PNG</button><button id="export-svg" title="Save the full scalable diagram with current highlighting">Export SVG</button><span id="export-status" role="status" aria-live="polite"></span></header><main><div id="canvas"><svg xmlns="http://www.w3.org/2000/svg" width="683" height="372" viewBox="0 0 683 372" data-engine="elk" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">From Kafka order to billing record</title><desc id="diagram-description">4 elements and 4 labeled data flows. Each arrow points from the source of the data to its recipient.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4d657c"/></marker></defs><style>

"middle"><tspan x="130" dy="0">Kafka</tspan></text><text class="node-technology" x="130" y="302" font-size="12" text-anchor="middle"></text></g><g class="node" data-dfd-type="Process" id="component-n1" data-node-id="bridge" tabindex="0" role="button" aria-label="Show connections for Fulfillment bridge"><title>Fulfillment bridge</title><rect x="463" y="212" width="180" height="84" rx="18"/><text class="node-kind" x="553" y="229" font-size="11" text-anchor="middle"><tspan x="553" dy="0">Process</tspan></text><text class="node-title" x="553" y="250" font-size="16" text-anchor="middle"><tspan x="553" dy="0">Fulfillment bridge</tspan></text><text class="node-technology" x="553" y="272" font-size="12" text-anchor="middle"></text></g><g class="node" data-dfd-type="Process" id="component-n2" data-node-id="billing" tabindex="0" role="button" aria-label="Show connections for Billing app"><title>Billing app</title><rect x="40" y="134" width="180" height="84" rx="18"/><text class="node-kind" x="130" y="151" font-size="11" text-anchor="middle"><tspan x="130" dy="0">Process</tspan></text><text class="node-title" x="130" y="172" font-size="16" text-anchor="middle"><tspan x="130" dy="0">Billing app</tspan></text><text class="node-technology" x="130" y="194" font-size="12" text-anchor="middle"></text></g><g class="node" data-dfd-type="DataStore" id="component-n3" data-node-id="oracle" tabindex="0" role="button" aria-label="Show connections for Oracle"><title>Oracle</title><rect x="463" y="104" width="180" height="84" rx="0"/><path class="store-rails" d="M463,104h180 M463,188h180"/><text class="node-kind" x="553" y="121" font-size="11" text-anchor="middle"><tspan x="553" dy="0">Data store</tspan></text><text class="node-title" x="553" y="142" font-size="16" text-anchor="middle"><tspan x="553" dy="0">Oracle</tspan></text><text class="node-technology" x="553" y="164" font-size="12" text-anchor="middle"></text></g><g class="edgeLabel" data-edge-id="R01"><title>R01: Order consumed directly by bridge</title><g class="label" data-id="R01"><rect x="265.5" y="287" width="152" height="44" rx="3"/><text class="edge-label-text" x="341.5" y="303" font-size="14" text-anchor="middle"><tspan x="341.5" dy="0">R01 Order consumed</tspan><tspan x="341.5" dy="18">directly by bridge</tspan></text></g></g><g class="edgeLabel" data-edge-id="R02"><title>R02: Sends order</title><g class="label" data-id="R02"><rect x="280" y="247" width="123" height="26" rx="3"/><text class="edge-label-text" x="341.5" y="263" font-size="14" text-anchor="middle"><tspan x="341.5" dy="0">R02 Sends order</tspan></text></g></g><g class="edgeLabel" data-edge-id="R03"><title>R03: Immediately acknowledges receipt</title><g class="label" data-id="R03"><rect x="265" y="186" width="153" height="44" rx="3"/><text class="edge-label-text" x="341.5" y="202" font-size="14" text-anchor="middle"><tspan x="341.5" dy="0">R03 Immediately</tspan><tspan x="341.5" dy="18">acknowledges receipt</tspan></text></g></g><g class="edgeLabel" data-edge-id="R04"><title>R04: Stores order</title><g class="label" data-id="R04"><rect x="279.5" y="149" width="124" height="26" rx="3"/><text class="edge-label-text" x="341.5" y="165" font-size="14" text-anchor="middle"><tspan x="341.5" dy="0">R04 Stores order</tspan></text></g></g></svg></div><aside aria-live="polite"><h2 id="selection-title">All connections</h2><p id="details">Select a node to highlight its incoming and outgoing arrows. Select an arrow or relationship below to isolate it.</p><div class="legend"><span>Blue: outgoing</span><span>Brown: incoming</span></div><ol id="connections"></ol></aside></main><script>
const graph={"width":683,"height":372,"direction":"RIGHT","nodes":[{"id":"kafka","label":"Kafka","type":"DataStore","alias":"n0","x":40,"y":242,"width":180,"height":84,"titleLines":["Kafka"],"technologyLines":[]},{"id":"bridge","label":"Fulfillment bridge","type":"Process","alias":"n1","x":463,"y":212,"width":180,"height":84,"titleLines":["Fulfillment bridge"],"technologyLines":[]},{"id":"billing","label":"Billing app","type":"Process","alias":"n2","x":40,"y":134,"width":180,"height":84,"titleLines":["Billing app"],"technologyLines":[]},{"id":"oracle","label":"Oracle","type":"DataStore","alias":"n3","x":463,"y":104,"width":180,"height":84,"titleLines":["Oracle"],"technologyLines":[]}],"relationships":[{"id":"R01","from":"kafka","to":"bridge","label":"Order consumed directly by bridge","displayLines":["R01 Order consumed","directly by bridge"],"points":[{"x":220,"y":284},{"x":430,"y":284},{"x":430,"y":275},{"x":463,"y":275}],"labelBox":{"x":265.5,"y":287,"width":152,"height":44}},{"id":"R02","from":"bridge","to":"billing","label":"Sends order","displayLines":["R02 Sends order"],"points":[{"x":463,"y":254},{"x":430,"y":254},{"x":430,"y":244},{"x":232,"y":244},{"x":232,"y":197},{"x":220,"y":197}],"labelBox":{"x":280,"y":247,"width":123,"height":26}},{"id":"R03","from":"billing","to":"bridge","label":"Immediately acknowledges receipt","displayLines":["R03 Immediately","acknowledges receipt"],"points":[{"x":220,"y":176},{"x":242,"y":176},{"x":242,"y":233},{"x":463,"y":233}],"labelBox":{"x":265,"y":186,"width":153,"height":44}},{"id":"R04","from":"billing","to":"oracle","label":"Stores order","displayLines":["R04 Stores order"],"points":[{"x":220,"y":155},{"x":232,"y":155},{"x":232,"y":146},{"x":463,"y":146}],"labelBox":{"x":279.5,"y":149,"width":124,"height":26}}]};
const root=document.querySelector('#canvas svg'),title=document.getElementById('selection-title'),details=document.getElementById('details'),list=document.getElementById('connections');
let locked=null,zoom=1;
const nodes=new Map(graph.nodes.map(node=>[node.id,node]));
function show(selection){
 const related=selection?.kind==='node'?graph.relationships.filter(edge=>edge.from===selection.id||edge.to===selection.id):selection?.kind==='edge'?graph.relationships.filter(edge=>edge.id===selection.id):graph.relationships;
 const ids=new Set(related.map(edge=>edge.id)),visibleNodes=new Set(related.flatMap(edge=>[edge.from,edge.to]));
 if(selection?.kind==='node')visibleNodes.add(selection.id);
 root.querySelectorAll('.node').forEach(element=>{const id=element.dataset.nodeId;element.classList.toggle('dimmed',!!selection&&!visibleNodes.has(id));element.classList.toggle('selected',selection?.kind==='node'&&id===selection.id);});
 root.querySelectorAll('.edge,.edgeLabel').forEach(element=>{const edge=graph.relationships.find(edge=>edge.id===element.dataset.edgeId),active=ids.has(edge.id);element.classList.toggle('dimmed',!!selection&&!active);element.classList.toggle('outgoing',!!selection&&active&&(selection.kind==='edge'||edge.from===selection.id));element.classList.toggle('incoming',!!selection&&active&&selection.kind==='node'&&edge.to===selection.id&&edge.from!==selection.id);});
 const node=selection?.kind==='node'?nodes.get(selection.id):null,edge=selection?.kind==='edge'?related[0]:null;
 title.textContent=node?.label??(edge?edge.id+' · '+edge.label:'All connections');details.textContent=node?[node.technology,node.description,related.length+' connected relationships'].filter(Boolean).join('\n'):edge?[nodes.get(edge.from).label+' → '+nodes.get(edge.to).label,edge.technology,edge.description].filter(Boolean).join('\n'):'Select a node to highlight its incoming and outgoing arrows. Select an arrow or relationship below to isolate it.';
 list.replaceChildren();for(const edge of related){const item=document.createElement('li'),button=document.createElement('button'),small=document.createElement('small');button.textContent=edge.id+' · '+nodes.get(edge.from).label+' → '+nodes.get(edge.to).label;small.textContent=edge.label+(edge.technology?' · '+edge.technology:'');button.append(small);button.addEventListener('click',()=>{locked={kind:'edge',id:edge.id};show(locked);});item.append(button);const sources=document.getElementById('sources-'+edge.id);if(sources)item.append(sources.content.cloneNode(true));list.append(item);}
}
root.querySelectorAll('.node').forEach(element=>{const select=()=>{locked={kind:'node',id:element.dataset.nodeId};show(locked);};element.addEventListener('click',select);element.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select();}});element.addEventListener('mouseenter',()=>{if(!locked)show({kind:'node',id:element.dataset.nodeId});});element.addEventListener('mouseleave',()=>{if(!locked)show(null);});});
root.querySelectorAll('.edge,.edgeLabel').forEach(element=>element.addEventListener('click',()=>{locked={kind:'edge',id:element.dataset.edgeId};show(locked);}));
function reset(){locked=null;show(null);}document.getElementById('reset-view').addEventListener('click',reset);document.addEventListener('keydown',event=>{if(event.key==='Escape')reset();});root.querySelector('.background').addEventListener('click',reset);
function setZoom(value){zoom=Math.max(.5,Math.min(3,value));root.style.width=zoom*100+'%';root.style.minWidth=zoom*900+'px';}document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom*1.25));document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom/1.25));show(null);

const exportPngButton=document.getElementById('export-png');
const exportSvgButton=document.getElementById('export-svg');
const exportStatus=document.getElementById('export-status');
function exportSlug(value,fallback){
 return String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||fallback;
}
function captureDiagramExport(){
 const bounds=root.viewBox.baseVal;
 const width=Math.ceil(bounds.width),height=Math.ceil(bounds.height);
 if(!Number.isFinite(width)||!Number.isFinite(height)||width<=0||height<=0)throw new Error('The diagram has no valid export dimensions.');
 const clone=root.cloneNode(true);
 // CSS zoom and scrolling affect the view only, never the exported diagram.
 clone.removeAttribute('style');
 clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
 clone.setAttribute('width',String(width));clone.setAttribute('height',String(height));
 clone.setAttribute('viewBox',[bounds.x,bounds.y,bounds.width,bounds.height].join(' '));
 const selectedNode=root.querySelector('.node.selected')?.getAttribute('data-node-id');
 const scope=selectedNode?'node-'+exportSlug(selectedNode,'component'):locked?.kind==='edge'?'edge-'+exportSlug(locked.id,'relationship'):'all';
 const filename=exportSlug(document.title,'c4-diagram').toLowerCase()+'-'+scope;
 return {width,height,filename,source:new XMLSerializer().serializeToString(clone)};
}
function downloadDiagramBlob(blob,filename){
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=filename;link.hidden=true;document.body.append(link);
 try{link.click();}finally{
  link.remove();
  // Keep the URL alive long enough for browsers to begin reading the download.
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }
}
async function rasterizeDiagram(snapshot){
 await document.fonts.ready;
 const scale=2,width=snapshot.width*scale,height=snapshot.height*scale;
 if(width>32767||height>32767||width*height>64000000)throw new Error('This diagram is too large for PNG. Use Export SVG for the full diagram.');
 const url=URL.createObjectURL(new Blob([snapshot.source],{type:'image/svg+xml;charset=utf-8'}));
 try{
  const image=new Image();
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('The diagram image could not be loaded for PNG export.'));image.src=url;});
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const context=canvas.getContext('2d');
  if(!context)throw new Error('PNG export is unavailable in this browser. Use Export SVG instead.');
  context.fillStyle='#ffffff';context.fillRect(0,0,width,height);context.drawImage(image,0,0,width,height);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG export failed. Use Export SVG instead.')),'image/png'));
  return {blob,width,height};
 }finally{URL.revokeObjectURL(url);}
}
async function exportDiagram(format){
 if(exportPngButton.disabled||exportSvgButton.disabled)return;
 exportPngButton.disabled=true;exportSvgButton.disabled=true;exportStatus.textContent='Preparing '+format.toUpperCase()+'…';
 try{
  // Capture the selection and filename before any await. Later UI changes must
  // not change an export that is already in progress.
  const snapshot=captureDiagramExport();
  if(format==='svg'){
   downloadDiagramBlob(new Blob([snapshot.source],{type:'image/svg+xml;charset=utf-8'}),snapshot.filename+'.svg');
   exportStatus.textContent='SVG download started ('+snapshot.width+' × '+snapshot.height+').';
  }else{
   const result=await rasterizeDiagram(snapshot);
   downloadDiagramBlob(result.blob,snapshot.filename+'.png');
   exportStatus.textContent='PNG download started ('+result.width+' × '+result.height+').';
  }
 }catch(error){exportStatus.textContent='Export failed: '+(error instanceof Error?error.message:'Please try again.');}
 finally{exportPngButton.disabled=false;exportSvgButton.disabled=false;}
}
exportPngButton.addEventListener('click',()=>exportDiagram('png'));
exportSvgButton.addEventListener('click',()=>exportDiagram('svg'));

</script></body></html>

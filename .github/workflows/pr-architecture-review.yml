name: PR architecture review
run-name: 'Architecture review for PR #${{ inputs.pr_number }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      source_root:
        description: Repository-relative source directory in both PR revisions
        type: string
        default: src
      post_comment:
        description: Post an architecture review summary to the pull request
        type: boolean
        default: false
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      source_root:
        description: Repository-relative source directory in both PR revisions
        type: string
        default: src
      post_comment:
        description: Post an architecture review summary to the pull request
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    uses: ./.github/workflows/pr-architecture-review-report.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      source_root: ${{ inputs.source_root }}
      include_comment_summary: ${{ inputs.post_comment }}

  comment:
    name: Post PR summary
    if: inputs.post_comment
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The writer receives only metadata from the read-only review job.
    permissions:
      pull-requests: write
    steps:
      - name: Post or update this run's comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REVIEW_SUMMARY: ${{ needs.review.outputs.summary }}
          ARTIFACT_ID: ${{ needs.review.outputs.artifact_id }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Missing or invalid PR review metadata.'
            exit 1
          fi
          details=$(jq -er '[.counts.added, .counts.removed, .counts.changed, .base, .head, .has_diagram] | @tsv' <<< "$REVIEW_SUMMARY")
          IFS=$'\t' read -r added removed changed base_status head_status has_diagram <<< "$details"
          if [[ ! "$added" =~ ^[0-9]+$ || ! "$removed" =~ ^[0-9]+$ || ! "$changed" =~ ^[0-9]+$ ||
                ! "$base_status" =~ ^(complete|partial)$ || ! "$head_status" =~ ^(complete|partial)$ ||
                ! "$has_diagram" =~ ^(true|false)$ ]]; then
            echo '::error::Missing or invalid PR review summary.'
            exit 1
          fi

          artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID"
          download='Download the Markdown report'
          if [[ "$has_diagram" == true ]]; then
            download+=' and focused diagram'
          fi
          marker="<!-- c4-architecture-review-run:$GITHUB_RUN_ID -->"
          body=$(printf '%s\n**Component architecture review**\n\n`%s` → `%s` · Base scan **%s** · Head scan **%s**\n\nDependencies · **%s added**, **%s removed**, **%s changed**.\n\n[%s](%s)\n' \
            "$marker" "${BASE_SHA:0:7}" "${HEAD_SHA:0:7}" "$base_status" "$head_status" "$added" "$removed" "$changed" "$download" "$artifact_url")

          repo="repos/$GITHUB_REPOSITORY"
          comments="$repo/issues/$PR_NUMBER/comments"
          existing=$(gh api --paginate "$comments?per_page=100" | jq -rs --arg marker "$marker" '
            first(.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id) // empty')
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "$repo/issues/comments/$existing" --raw-field body="$body" --jq .html_url
          else
            gh api --method POST "$comments" --raw-field body="$body" --jq .html_url
          fi

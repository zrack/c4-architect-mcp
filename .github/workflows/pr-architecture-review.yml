name: PR architecture review
run-name: 'Architecture review for PR #${{ inputs.pr_number }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      post_comment:
        description: Post an architecture review summary to the pull request
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      summary: ${{ steps.compare.outputs.summary }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Resolve PR revisions
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Enter a positive pull request number.'
            exit 1
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          base_sha=$(jq -er '.base.sha' <<< "$pr")
          head_sha=$(jq -er '.head.sha' <<< "$pr")
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::GitHub did not return valid base and head commit SHAs.'
            exit 1
          fi
          printf 'number=%s\nbase_sha=%s\nhead_sha=%s\n' "$PR_NUMBER" "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: pr-base
          persist-credentials: false

      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base repository hosts this ref for fork PRs as well.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          path: pr-head
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the published review tool
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/c4-review-tool" --omit=dev --ignore-scripts \
            --no-audit --no-fund --registry=https://registry.npmjs.org c4-architect-mcp@0.2.0-alpha.3

      - name: Compare Component snapshots
        id: compare
        working-directory: ${{ runner.temp }}
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          POST_COMMENT: ${{ inputs.post_comment }}
        run: |
          base="$GITHUB_WORKSPACE/pr-base"
          head="$GITHUB_WORKSPACE/pr-head"
          if [[ "$(git -C "$base" rev-parse HEAD)" != "$BASE_SHA" || "$(git -C "$head" rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo '::error::The checked-out commits differ from the resolved PR revisions. Run the review again to capture the current revisions.'
            exit 1
          fi
          if [[ ! -d "$base/src" || -L "$base/src" || ! -d "$head/src" || -L "$head/src" ]]; then
            echo '::error::Both PR revisions must contain a src directory.'
            exit 1
          fi

          stage_dependencies() {
            local snapshot="$1" stage="$2" label="$3"
            if [[ -e "$snapshot/node_modules" || -L "$snapshot/node_modules" ]]; then
              echo "::error::$label already contains node_modules. Refusing to overlay it."
              return 1
            fi

            # Only copy the two JSON inputs. PR .npmrc files and other checkout content
            # must stay out of npm's working directory.
            local manifest="$snapshot/package.json" lock="$snapshot/package-lock.json"
            if [[ ! -f "$manifest" || -L "$manifest" || ! -f "$lock" || -L "$lock" ]] ||
              ! jq -e 'type == "object" and .workspaces == null' "$manifest" >/dev/null ||
              ! jq -e --arg package '[A-Za-z0-9_~-][A-Za-z0-9_.~-]*' '
                ("node_modules/(@" + $package + "/)?" + $package) as $module_path |
                .lockfileVersion == 3 and (.packages[""] | type == "object" and .workspaces == null) and
                all(.packages | to_entries[] | select(.key != "");
                  (.key | test("^(" + $module_path + "/)*" + $module_path + "$")) and
                  (.value.link == null or .value.link == false) and
                  (.value.resolved | startswith("https://registry.npmjs.org/")) and
                  (.value.integrity | test("^sha512-[A-Za-z0-9+/]{86}==$")))
              ' "$lock" >/dev/null; then
              echo "::warning::$label has no supported public npm lockfile. Scanning source without staged dependencies."
              return
            fi

            mkdir "$stage"
            cp -- "$manifest" "$lock" "$stage/"
            # npm's registry-only flags block Git preparation and local/direct URL fetches.
            if ! (cd "$stage" && npm ci --ignore-scripts --no-bin-links --workspaces=false \
              --allow-git=none --allow-file=none --allow-directory=none --allow-remote=none \
              --registry=https://registry.npmjs.org --no-audit --no-fund \
              --userconfig="$stage/empty-user.npmrc" --globalconfig="$stage/empty-global.npmrc"); then
              echo "::warning::$label dependencies could not be staged. Scanning source without them."
              return
            fi
            if [[ -d "$stage/node_modules" ]]; then
              ln -sT -- "$stage/node_modules" "$snapshot/node_modules"
            fi
          }

          if [[ "$(npm config get allow-git allow-file allow-directory allow-remote)" != \
            $'allow-git=all\nallow-file=all\nallow-directory=all\nallow-remote=all' ]]; then
            echo '::error::Expected an npm version with registry-only dependency controls.'
            exit 1
          fi
          stage_dependencies "$base" "$RUNNER_TEMP/c4-dependencies-base" Base
          stage_dependencies "$head" "$RUNNER_TEMP/c4-dependencies-head" Head

          cli="$RUNNER_TEMP/c4-review-tool/node_modules/c4-architect-mcp/dist/index.js"
          graphs="$RUNNER_TEMP/c4-review-graphs"
          node "$cli" analyze "$base/src" --level Component --commit "$BASE_SHA" --out "$graphs/base.json" --summary
          node "$cli" analyze "$head/src" --level Component --commit "$HEAD_SHA" --out "$graphs/head.json" --summary
          review=$(node "$cli" review "$graphs/base.json" "$graphs/head.json" \
            --out "$RUNNER_TEMP/c4-architecture-review/PR-ARCHITECTURE.md" \
            --github-repo "$GITHUB_REPOSITORY" --source-root src --title "PR #$PR_NUMBER architecture review")
          printf '%s\n' "$review"

          if [[ "$POST_COMMENT" == true ]]; then
            diff=$(node "$cli" diff "$graphs/base.json" "$graphs/head.json" --limit 1)
            summary=$(jq -ce --slurpfile base "$graphs/base.json" --slurpfile head "$graphs/head.json" \
              --argjson has_diagram "$(jq -c 'has("diagram")' <<< "$review")" \
              '{counts: .edges.counts, base: $base[0].metadata.analysisStatus, head: $head[0].metadata.analysisStatus, has_diagram: $has_diagram}' \
              <<< "$diff")
            printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report and focused diagram
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ steps.pr.outputs.number }}-architecture-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c4-architecture-review/
          if-no-files-found: error

  comment:
    name: Post PR summary
    if: inputs.post_comment
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The writer receives only metadata from the read-only review job.
    permissions:
      pull-requests: write
    steps:
      - name: Post or update this run's comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REVIEW_SUMMARY: ${{ needs.review.outputs.summary }}
          ARTIFACT_ID: ${{ needs.review.outputs.artifact_id }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Missing or invalid PR review metadata.'
            exit 1
          fi
          details=$(jq -er '[.counts.added, .counts.removed, .counts.changed, .base, .head, .has_diagram] | @tsv' <<< "$REVIEW_SUMMARY")
          IFS=$'\t' read -r added removed changed base_status head_status has_diagram <<< "$details"
          if [[ ! "$added" =~ ^[0-9]+$ || ! "$removed" =~ ^[0-9]+$ || ! "$changed" =~ ^[0-9]+$ ||
                ! "$base_status" =~ ^(complete|partial)$ || ! "$head_status" =~ ^(complete|partial)$ ||
                ! "$has_diagram" =~ ^(true|false)$ ]]; then
            echo '::error::Missing or invalid PR review summary.'
            exit 1
          fi

          artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID"
          download='Download the Markdown report'
          if [[ "$has_diagram" == true ]]; then
            download+=' and focused diagram'
          fi
          marker="<!-- c4-architecture-review-run:$GITHUB_RUN_ID -->"
          body=$(printf '%s\n**Component architecture review**\n\n`%s` → `%s` · Base scan **%s** · Head scan **%s**\n\nDependencies · **%s added**, **%s removed**, **%s changed**.\n\n[%s](%s)\n' \
            "$marker" "${BASE_SHA:0:7}" "${HEAD_SHA:0:7}" "$base_status" "$head_status" "$added" "$removed" "$changed" "$download" "$artifact_url")

          repo="repos/$GITHUB_REPOSITORY"
          comments="$repo/issues/$PR_NUMBER/comments"
          existing=$(gh api --paginate "$comments?per_page=100" | jq -rs --arg marker "$marker" '
            first(.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id) // empty')
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "$repo/issues/comments/$existing" --raw-field body="$body" --jq .html_url
          else
            gh api --method POST "$comments" --raw-field body="$body" --jq .html_url
          fi
